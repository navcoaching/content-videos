<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Nav Coaching Story (App)</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Almarai:wght@400;700&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#07142a;--ink2:#0d1f3c;--cyan:#4cc5ed;--on:#eaf2fb;--onm:#a9bad0}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:Almarai,Cairo,sans-serif;color:var(--on);position:relative;
 background:radial-gradient(70% 45% at 50% 45%,#1c3d78 0%,transparent 70%),linear-gradient(180deg,var(--ink2),var(--ink))}
body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#4cc5ed12 1px,transparent 1px),linear-gradient(90deg,#4cc5ed12 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(75% 55% at 50% 45%,#000,transparent)}
.tag{position:absolute;top:260px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;font:500 26px "Readex Pro";letter-spacing:.08em;border:2px solid #ffffff2a;border-radius:99px;padding:10px 26px;color:var(--onm);white-space:nowrap}
.tag i{width:30px;height:12px;background:var(--cyan);transform:skewX(-25deg)}
h1{position:absolute;top:345px;width:100%;text-align:center;font:900 92px/1.2 Cairo}
h1 em{font-style:normal;color:var(--cyan)}
.shot{position:absolute;border-radius:22px;overflow:hidden;border-top:9px solid var(--cyan);box-shadow:0 50px 100px #000b;background:#fff}
.shot img{display:block;width:100%}
.a{width:680px;right:50px;top:600px;transform:rotate(3deg)}
.b{width:620px;left:40px;top:830px;transform:rotate(-4deg)}
.c{width:580px;left:36px;top:1110px;transform:rotate(-3deg)}
.brand{position:absolute;right:56px;top:1360px;width:400px;background:var(--ink);border:2px solid #4cc5ed66;border-radius:8px;padding:26px 32px;transform:rotate(-2deg);box-shadow:0 40px 80px #000c;text-align:right;z-index:5}
.brand::after{content:"";position:absolute;right:0;top:0;bottom:0;width:9px;background:var(--cyan)}
.brand img{height:50px;display:block;margin-inline-start:auto}
.brand b{display:block;font:900 36px Cairo;color:#fff;margin:12px 0 4px}
.brand span{font:500 21px "Readex Pro";color:var(--onm);direction:ltr;display:block;text-align:right}
</style></head><body>
<span class="tag"><i></i> NAV COACHING</span>
<h1>برنامجك وتغذيتك<br><em>في مكان واحد</em></h1>
<div class="shot a"><img src="brand/shots/my-program.webp" alt=""></div>
<div class="shot c"><img src="brand/shots/nutrition-day.webp" alt=""></div>
<div class="brand"><img src="brand/logo-white.webp" alt="Nav Coaching"><b>برنامجك الشخصي</b><span>navcoaching.com</span></div>
</body></html>
