<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{background:transparent;font-family:'Noto Kufi Arabic'}
.f{width:1080px;height:1920px;position:relative;color:#fff;display:none}
.top{position:absolute;top:150px;left:60px;right:60px;text-align:center}
.nm{font-size:66px;font-weight:800;line-height:1.4;text-shadow:0 3px 18px #000c}
.tg{display:inline-block;margin-top:14px;font-size:34px;font-weight:700;padding:6px 26px;border-radius:40px;background:#4cc5ed;color:#05101f}
.tg.l{background:#4cc5ed}.tg.i{background:#f2b880}.tg.s{background:#fff}
.rp{position:absolute;top:1560px;left:0;right:0;text-align:center;font-size:44px;font-weight:700;text-shadow:0 3px 14px #000c}
.k{position:absolute;top:120px;right:60px;font-size:30px;color:#ffffffaa;direction:ltr}
.logo{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);height:64px}
.hook{position:absolute;top:620px;left:70px;right:70px;text-align:center}
.hook h1{font-size:96px;line-height:1.35;font-weight:800;text-shadow:0 4px 24px #000}
.hook h1 b{color:#4cc5ed}
.hook p{font-size:44px;margin-top:30px;font-weight:700}
.hook p span{padding:0 10px}
</style></head><body>
<div class="f" id="hook"><div class="hook"><h1>مرونة <b>الورك</b><br>في 20 ثانية</h1><p><span style="color:#4cc5ed">طوّل</span>•<span style="color:#f2b880">اعزل</span>•<span>قوِّ</span></p></div><img class="logo" src="../../brand/logo-white.webp"></div>
<div class="f" id="end"><div class="hook"><h1>احفظه وطبّقه<br><b>قبل تمرين الرجل</b></h1><p>دورتين • راحة 30 ثانية</p><p style="font-size:38px;color:#4cc5ed;margin-top:60px">navcoaching.com</p></div><img class="logo" src="../../brand/logo-white.webp"></div>
<script>
const S=[['إطالة القوزاق','l','تطويل','30 ثانية لكل جهة'],['رفع الرجل الجانبي','i','عزل','15 تكرار لكل رجل'],['سكوات','s','تقوية','3 جولات × 12'],['إطالة الخلفية جلوسًا','l','تطويل','30 ثانية'],['ركلة الحمار','i','عزل','15 تكرار لكل رجل'],['لانج خلفي','s','تقوية','3 جولات × 10 لكل رجل']];
document.body.insertAdjacentHTML('beforeend',S.map((s,i)=>`<div class="f" id="s${i+1}"><div class="k">${i+1} / 6</div><div class="top"><div class="nm">${s[0]}</div><div class="tg ${s[1]}">${s[2]}</div></div><div class="rp">${s[3]}</div><img class="logo" src="../../brand/logo-white.webp"></div>`).join(''));
</script></body></html>
