<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{background:transparent;font-family:'Noto Kufi Arabic'}
.f{width:1080px;height:1920px;position:relative;color:#fff;display:none}
.st{position:absolute;left:0;right:0;height:640px;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:ltr;font-family:'Readex Pro'}
.lb{font-size:44px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 14px #000,0 0 4px #000a;text-align:center;padding:0 40px}
.L{color:#4cc5ed}.I{color:#f2b880}.S{color:#fff}
.rp{font-size:30px;font-weight:500;margin-top:8px;text-shadow:0 2px 10px #000;color:#e6edf7}
.dv{position:absolute;left:0;right:0;height:4px;background:#05101f}
.logo{position:absolute;bottom:40px;right:40px;height:46px}
.hook{position:absolute;top:640px;left:70px;right:70px;text-align:center}
.hook h1{font-size:96px;line-height:1.35;font-weight:800;text-shadow:0 4px 24px #000}
.hook h1 b{color:#4cc5ed}
.hook p{font-size:40px;margin-top:30px;font-weight:700;direction:ltr;font-family:'Readex Pro'}
.big{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);height:64px}
</style></head><body>
<div class="f" id="hook"><div class="hook"><h1>مرونة <b>الورك</b><br>في 15 ثانية</h1><p><span style="color:#4cc5ed">LENGTHEN</span> • <span style="color:#f2b880">ISOLATE</span> • STRENGTHEN</p></div><img class="big" src="../../brand/logo-white.webp"></div>
<div class="f" id="end"><div class="hook"><h1>احفظه وطبّقه<br><b>قبل تمرين الرجل</b></h1><p style="font-family:'Noto Kufi Arabic';direction:rtl">دورتين • راحة 30 ثانية</p><p style="font-size:38px;color:#4cc5ed;margin-top:60px">navcoaching.com</p></div><img class="big" src="../../brand/logo-white.webp"></div>
<script>
const P=[[['LOW LUNGE HIP FLEXOR STRETCH','L','LENGTHEN','30 SEC / SIDE'],['SIDE-LYING CLAMSHELL','I','ISOLATE','15 REPS / SIDE'],['BANDED SQUAT','S','STRENGTHEN','3 × 12']],
[['SEATED HAMSTRING STRETCH','L','LENGTHEN','30 SEC'],['SIDE-LYING LEG RAISE','I','ISOLATE','15 REPS / SIDE'],['REVERSE LUNGE','S','STRENGTHEN','3 × 10 / SIDE']]];
document.body.insertAdjacentHTML('beforeend',P.map((p,k)=>`<div class="f" id="p${k+1}">${p.map((s,i)=>`<div class="st" style="top:${i*640}px"><div class="lb">${s[0]} <span class="${s[1]}">(${s[2]})</span></div><div class="rp">${s[3]}</div></div>`).join('')}<div class="dv" style="top:638px"></div><div class="dv" style="top:1278px"></div><img class="logo" src="../../brand/logo-white.webp"></div>`).join(''));
</script></body></html>
