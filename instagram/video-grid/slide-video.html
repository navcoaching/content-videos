<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
:root{--ink:#07142a;--navy:#284da0;--cyan:#4cc5ed;--cyan-ink:#0a6a8f;--cyan-soft:#e4f6fc;--paper:#f3f6fa;--line:#d8e1ea;--muted:#56667a;--head:#0b1a33}
*{box-sizing:border-box;margin:0}body{background:#999;font-family:"IBM Plex Sans Arabic",Cairo,sans-serif}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--paper)}
.s::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#284da00f 1px,transparent 1px),linear-gradient(90deg,#284da00f 1px,transparent 1px);background-size:56px 56px}
.top{position:absolute;top:44px;right:48px;left:48px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.top img{height:50px}
.eb{display:inline-flex;align-items:center;gap:10px;font:700 26px "Readex Pro","IBM Plex Sans Arabic";color:var(--cyan-ink);background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:8px 22px}
.eb i{display:inline-block;width:7px;height:20px;background:var(--cyan);transform:skewX(-22deg);margin-left:3px}
.grid{position:absolute;top:130px;right:48px;left:48px;bottom:110px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;column-gap:24px;row-gap:100px;z-index:2}
.t{min-height:0;background:#fff;border:1.5px solid var(--line);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 36px #284da014}
.vid{flex:1;min-height:0;overflow:hidden;position:relative;background:transparent;display:flex;align-items:center;justify-content:center}
.fig{height:84%;aspect-ratio:100/200;margin-top:10px}.fig svg{width:100%;height:100%}
.ph{position:absolute;top:18px;right:18px;font-size:20px;color:var(--muted);background:#fffc;border-radius:99px;padding:3px 14px;border:1px dashed #9fb3c8}
.play{position:absolute;left:20px;bottom:20px;width:62px;height:62px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center}
.play svg{width:28px;fill:#fff;margin-left:4px}
.no{position:absolute;top:16px;left:18px;width:52px;height:52px;border-radius:16px;background:var(--cyan);color:var(--ink);font:700 28px "Readex Pro";display:flex;align-items:center;justify-content:center}
.cap{padding:16px 22px 18px;border-top:1.5px solid var(--line)}
.cap b{display:block;font:700 27px "Readex Pro";direction:ltr;text-align:right;color:var(--head)}
.cap span{font-size:21px;color:var(--muted)}
.label{position:absolute;z-index:4;top:685px;left:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;border-radius:99px;padding:16px 40px;font:900 38px Cairo;display:flex;align-items:center;gap:16px;box-shadow:0 18px 40px #07142a40;white-space:nowrap}
.label i{display:block;width:9px;height:28px;background:var(--cyan);transform:skewX(-22deg)}
.label small{font:500 24px "IBM Plex Sans Arabic";color:#a9d8ec}
.foot{position:absolute;bottom:40px;right:48px;left:48px;display:flex;justify-content:space-between;align-items:center;font:500 24px "Readex Pro";color:var(--muted);z-index:3}
.foot .n{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 18px;direction:ltr}

body{background:transparent}
.t{background:transparent;border:none;box-shadow:none}
.cap{background:#fff;border:1.5px solid var(--line);border-top:none;border-radius:0 0 30px 30px}
.vid{border:1.5px solid var(--line);border-bottom:none;border-radius:30px 30px 0 0}
.credit{font:500 20px "Readex Pro";color:var(--muted);direction:ltr}
</style></head><body><section class="s" id="s1">
<div class="top"><img src="../../brand/logo-color-hd.png"><span class="eb">تمارين الرجل <span><i></i><i></i><i></i></span></span></div>
<div class="grid"><div class="t"><div class="vid" id="v1"><span class="no">1</span></div><div class="cap"><b>BODYWEIGHT SQUAT</b><span>بدون وزن · أفخاذ وقلوتس</span></div></div><div class="t"><div class="vid" id="v2"><span class="no">2</span></div><div class="cap"><b>GOBLET SQUAT</b><span>نفس الحركة مع وزن أمامك</span></div></div><div class="t"><div class="vid" id="v3"><span class="no">3</span></div><div class="cap"><b>BODYWEIGHT LUNGE</b><span>رجل وحدة · ثبات وتوازن</span></div></div><div class="t"><div class="vid" id="v4"><span class="no">4</span></div><div class="cap"><b>DUMBBELL LUNGE</b><span>نفس الحركة مع دمبلز</span></div></div></div>
<div class="label"><span style="display:flex;gap:5px"><i></i><i></i></span>تدرّج خطوة بخطوة<small>من وزن الجسم إلى الأوزان</small></div>
<div class="foot"><span class="credit">Videos: Mixkit (Free License)</span><span style="font-family:'IBM Plex Sans Arabic'">احفظ البوست وجرّبه اليوم</span></div>
</section></body></html>
