<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>جدول تمرين 3 أيام بالنادي — Nav Coaching</title>
<style>
@page{size:1440px 810px;margin:0}
:root{--ink:#07142a;--ink2:#0d1f3c;--ink3:#15294b;--navy:#284da0;--navy2:#3558b0;--cyan:#4cc5ed;--cyan-ink:#0a6a8f;--cyan-soft:#e4f6fc;
 --paper:#f3f6fa;--surf:#eaf0f6;--line:#d8e1ea;--muted:#56667a;--head:#0b1a33;--on:#eaf2fb;--onm:#a9bad0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:"IBM Plex Sans Arabic",Cairo,sans-serif;color:var(--head);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:1440px;height:810px;position:relative;overflow:hidden;page-break-after:always;break-after:page}
.page:last-child{page-break-after:auto;break-after:auto}
a{color:inherit;text-decoration:none}

/* ---------- light theme */
.light{background:#fff;color:var(--head)}
.light::after{content:"";position:absolute;left:-120px;top:-160px;width:760px;height:760px;border-radius:50%;background:radial-gradient(#4cc5ed26,transparent 65%);pointer-events:none}
.grid::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#284da00d 1px,transparent 1px),linear-gradient(90deg,#284da00d 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(70% 80% at 40% 50%,#000,transparent)}
.slash{position:absolute;background:linear-gradient(180deg,#4cc5ed,#4cc5ed00);transform:skewX(-22deg);opacity:.35}
.slash.n{background:linear-gradient(180deg,#284da0,#284da000);opacity:.18}

.cover .logo{position:absolute;top:64px;right:84px;height:64px;z-index:2}
.cover .chip{position:absolute;top:196px;right:84px;display:flex;gap:10px;align-items:center;font:700 19px "IBM Plex Sans Arabic";color:var(--navy);background:var(--cyan-soft);border:1.5px solid #4cc5ed88;border-radius:99px;padding:8px 20px}
.cover .chip i{width:22px;height:9px;background:var(--cyan);transform:skewX(-25deg)}
.cover h1{position:absolute;top:262px;right:80px;font:800 118px/1.12 Cairo;letter-spacing:-.5px;color:var(--ink)}
.cover h1 em{font-style:normal;color:var(--navy)}
.cover .rule{position:absolute;top:548px;right:84px;width:150px;height:6px;background:var(--cyan);border-radius:3px}
.cover .sign{position:absolute;bottom:70px;right:84px;display:flex;gap:26px;align-items:center;font:500 20px "IBM Plex Sans Arabic";color:var(--muted)}
.cover .sign b{color:var(--ink);font:800 21px Cairo}
.cover .sign span+span{padding-right:26px;border-right:1.5px solid var(--line);direction:ltr;font-family:"Readex Pro";color:var(--navy)}

.days{position:absolute;left:84px;top:150px;width:520px;display:flex;flex-direction:column;gap:22px;z-index:2}
.day{position:relative;display:flex;align-items:center;gap:24px;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:24px 28px;box-shadow:0 14px 34px #07142a14}
.day .n{flex:none;width:78px;height:78px;border-radius:18px;background:var(--cyan);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 34px/1 Cairo}
.day .n small{font:700 13px "IBM Plex Sans Arabic";margin-bottom:4px}
.day.b .n{background:var(--navy);color:#fff}.day.c .n{background:var(--ink);color:#fff}
.day{border-right:6px solid var(--cyan)}.day.b{border-right-color:var(--navy)}.day.c{border-right-color:var(--ink)}
.day h3{font:800 34px/1.1 Cairo;color:var(--ink)}
.day p{font:500 17px "IBM Plex Sans Arabic";color:var(--muted);margin-top:6px}
.day .cnt{margin-right:auto;text-align:center;font:700 15px "IBM Plex Sans Arabic";color:var(--muted)}
.day .cnt b{display:block;font:800 36px/1 "Readex Pro";color:var(--navy)}

/* ---------- pager (progress bar) */
.pager{position:absolute;left:56px;right:56px;bottom:26px;height:34px;display:flex;align-items:center;gap:22px;z-index:5}
.pager .sec{font:700 15px "IBM Plex Sans Arabic";color:var(--muted);white-space:nowrap}
.pager .sec b{color:var(--navy);font-weight:700}
.pager .bar{flex:1;display:flex;gap:6px;direction:rtl}
.pager .bar i{flex:1;height:7px;border-radius:9px;background:#e3eaf2}
.pager .bar i.done{background:var(--navy)}
.pager .bar i.cur{background:linear-gradient(270deg,var(--navy),var(--cyan))}
.pager .num{font:700 17px "Readex Pro";color:var(--ink);direction:ltr;white-space:nowrap}
.pager .num span{color:#9fb0c3;font-weight:500}
.pager .url{font:500 14px "Readex Pro";color:var(--muted);direction:ltr}

/* ---------- day pages */
.dp .top{position:absolute;top:34px;right:56px;left:56px;height:96px;display:flex;align-items:center;gap:22px;z-index:2}
.dp .badge{width:86px;height:86px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 38px/1 Cairo;color:#fff;background:var(--navy)}
.dp .badge small{font:700 14px "IBM Plex Sans Arabic";margin-bottom:5px}
.dp .badge.a{background:var(--cyan);color:var(--ink)}.dp .badge.c{background:var(--ink)}
.dp h2{font:800 60px/1 Cairo;color:var(--ink)}
.dp .hint{display:flex;align-items:center;gap:10px;font:500 16px "IBM Plex Sans Arabic";color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:9px 18px}
.dp .hint .pl{width:24px;height:24px}
.dp .logo{height:44px;margin-right:18px}

.tbl{position:absolute;top:148px;right:56px;left:56px;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 12px 34px #07142a0f;z-index:2}
.tr{display:grid;grid-template-columns:50px 300px 244px 200px 88px 104px 1fr;align-items:center;direction:rtl}
.th{background:var(--ink);color:#fff;height:50px;font:700 16px "IBM Plex Sans Arabic"}
.th>div{text-align:center}.th>div.r{text-align:right;padding-right:16px}
.td{height:88px;border-top:1px solid var(--line)}
.td:nth-child(odd){background:#f8fafc}
.td>div{height:100%;display:flex;align-items:center;justify-content:center}
.td .idx{font:800 20px "Readex Pro";color:var(--navy)}
.td .ex,.td .alt{justify-content:flex-start;padding:0 16px}
.lnk{display:flex;align-items:center;gap:12px;direction:ltr;text-align:left}
.lnk .pl{flex:none;width:34px;height:34px}
.lnk b{font:700 17px/1.2 "Readex Pro";color:var(--ink);letter-spacing:.2px}
.lnk:hover b{color:var(--navy)}
.alt .lnk b{font-weight:500;color:#33445c;font-size:15px}
.alt .lnk .pl{width:28px;height:28px}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 10px}
.tag{font:700 14px "IBM Plex Sans Arabic";padding:4px 11px;border-radius:99px;background:var(--cyan-soft);border:1.5px solid var(--cyan);color:var(--cyan-ink);white-space:nowrap}
.tag.p{background:var(--navy);border-color:var(--navy);color:#fff}
.lg{display:flex;gap:16px;font:500 15px "IBM Plex Sans Arabic";color:var(--muted)}.lg span{display:flex;align-items:center;gap:7px}.lg i{width:14px;height:14px;border-radius:4px;background:var(--navy)}.lg i.s{background:var(--cyan)}
.fig{gap:10px}.fig svg{height:80px;width:80px}
.num{font:800 26px "Readex Pro";color:var(--ink)}
.rep{font:700 20px "Readex Pro";color:var(--ink);direction:ltr;background:var(--cyan-soft);border-radius:10px;padding:6px 12px}
.th .alt-h{text-align:right;padding-right:16px}
.legend{position:absolute;bottom:78px;right:58px;display:flex;gap:18px;font:500 14px "IBM Plex Sans Arabic";color:var(--muted);z-index:2}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px;vertical-align:-1px}
</style></head><body>

<!-- ================= PAGE 1 : COVER ================= -->
<section class="page light grid cover" data-sec="الغلاف">
 <i class="slash" style="left:-30px;bottom:-40px;width:120px;height:330px"></i>
 <i class="slash n" style="left:120px;bottom:-40px;width:120px;height:220px"></i>
 <i class="slash" style="right:640px;top:-40px;width:70px;height:170px;opacity:.25"></i>
 <img class="logo" src="../brand/logo-color.webp" alt="Nav Coaching">
 <span class="chip"><i></i>جدول مجاني</span>
 <h1>جدول تمرين<br><em>3 أيام</em> بالنادي</h1>
 <span class="rule"></span>
 <div class="sign"><span>إعداد <b>كوتش ناڤ</b></span><span>navcoaching.com</span></div>

 <div class="days">
  <div class="day a"><div class="n"><small>اليوم</small>1</div><div><h3>علوي</h3><p>صدر · ظهر · أكتاف · ذراعين</p></div><div class="cnt"><b>6</b>تمارين</div></div>
  <div class="day b"><div class="n"><small>اليوم</small>2</div><div><h3>سفلي</h3><p>أفخاذ · قلوتس · بطات · بطن</p></div><div class="cnt"><b>6</b>تمارين</div></div>
  <div class="day c"><div class="n"><small>اليوم</small>3</div><div><h3>شامل</h3><p>الجسم كامل</p></div><div class="cnt"><b>6</b>تمارين</div></div>
 </div>
</section>

<div id="dayPages"></div>


<script>
const TOTAL=7;
const PLAY='<svg class="pl" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#e4f6fc" stroke="#4cc5ed" stroke-width="1.5"/><path d="M14 11.5v11l9-5.5z" fill="#284da0"/></svg>';
const YT=id=>id.includes('/')?id:('https://www.youtube.com/'+(id.length&&id[0]==='w'?'watch?v='+id.slice(2):'shorts/'+id));
// ---- body diagram
const BASE='#d6e0eb',SIL='#eef3f8',STR='#c3cfdd',P='#284da0',S2='#4cc5ed';
function mir(d){return d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g,(m,x,y)=>(100-+x)+','+y)}
function shape(tag,attrs){return '<'+tag+' '+Object.entries(attrs).map(([k,v])=>k+'="'+v+'"').join(' ')+'/>'}
function both(kind,a,col){ // draws left + mirrored right
  if(kind==='e'){const [cx,cy,rx,ry]=a;return shape('ellipse',{cx,cy,rx,ry,fill:col})+shape('ellipse',{cx:100-cx,cy,rx,ry,fill:col})}
  return shape('path',{d:a,fill:col})+shape('path',{d:mir(a),fill:col})}
function sil(){let o='';
  o+=shape('circle',{cx:50,cy:15,r:10,fill:SIL,stroke:STR,'stroke-width':1.2});
  o+=shape('rect',{x:45,y:23,width:10,height:9,fill:SIL});
  const parts=['M30,33 Q50,28 70,33 L68,62 Q66,80 63,98 L37,98 Q34,80 32,62 Z','M37,96 L63,96 L65,112 L50,118 L35,112 Z'];
  parts.forEach(d=>o+=shape('path',{d,fill:SIL,stroke:STR,'stroke-width':1.2}));
  ['M24,35 Q15,38 14,52 L13,74 Q16,79 21,76 L26,52 Z','M13,76 L10,100 Q13,105 17,102 L21,78 Z','M35,110 Q32,140 36,160 L37,193 L46,193 L47,160 Q50,135 50,116 Z'].forEach(d=>{o+=shape('path',{d,fill:SIL,stroke:STR,'stroke-width':1.2})+shape('path',{d:mir(d),fill:SIL,stroke:STR,'stroke-width':1.2})});
  return o}
function body(view,pri,sec){const c=m=>pri.includes(m)?P:(sec.includes(m)?S2:BASE);let o=sil();
  if(view==='f'){
    o+=both('p','M37,37 Q49,35 49,39 L49,52 Q42,56 34,50 Q33,42 37,37Z',c('chest'));
    o+=both('e',[29.5,40,4.8,6.5],c('fdelt'));o+=both('e',[23.5,42,3.8,7],c('sdelt'));
    o+=both('e',[19,57,4.2,11],c('biceps'));
    o+=shape('rect',{x:43,y:58,width:14,height:36,rx:5,fill:c('abs')});
    o+=both('e',[42,136,7.5,23],c('quads'));o+=both('e',[41,172,4,14],BASE);
  }else{
    o+=shape('path',{d:'M50,30 L62,36 L57,52 L50,57 L43,52 L38,36Z',fill:c('rhomb')});
    o+=both('p','M34,46 Q40,52 46,58 L46,80 Q40,77 36,70 Q32,58 34,46Z',c('lats'));
    o+=both('e',[29.5,40,4.8,6.5],c('rdelt'));o+=both('e',[23.5,42,3.8,7],c('sdelt'));
    o+=both('e',[19,57,4.2,11],c('triceps'));
    o+=both('e',[43,106,8,9],c('glutes'));o+=both('e',[42,138,7,19],c('hams'));o+=both('e',[41,171,5.5,13],c('calves'));
  }
  const all=pri.concat(sec),LOW=['quads','glutes','hams','calves'];
  const vb=all.every(m=>LOW.includes(m))?'4 94 92 104':(all.length===1&&all[0]==='abs')?'4 26 92 92':'4 2 92 104';
  return '<svg viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet">'+o+'</svg>'}
// ---- data (content kept from the original file)
const DAYS=[
 {n:1,cls:'a',title:'علوي',rows:[
  ['INCLINE DB PRESS','Gruq177Psnk',['صدر علوي','أكتاف أمامية','تراي'],['chest'],['fdelt','triceps'],3,'6-12','MACHINE INCLINE CHEST PRESS','w:tiWPSwt8_zM'],
  ['FLAT DB PRESS','1V3vpcaxRYQ',['صدر','أكتاف أمامية','تراي'],['chest'],['fdelt','triceps'],3,'6-12','MACHINE CHEST PRESS','relql3kwCi8'],
  ['LATS PULLDOWN','w:hnSqbBk15tw',['لاتس','باي'],['lats'],['biceps'],3,'6-12','PULL UP','WLzut1ZxxTY'],
  ['SEATED ROW','w:YKAeU55CkVk',['لاتس','رومبويد','باي','كتف خلفي'],['lats','rhomb'],['biceps','rdelt'],3,'6-12','ONE ARM ROW','KaCcBqhiXtc'],
  ['DB LATERAL RAISE','JIhbYYA1Q90',['كتف جانبي'],['sdelt'],[],3,'6-12','MACHINE LATERAL RAISE','AydmHFgOn6U'],
  ['DB CURL','YgHnvJQkfhc',['باي'],['biceps'],[],3,'6-12','ZIG ZAG BAR CURL','JMT4HmbJadQ']]},
 {n:2,cls:'b',title:'سفلي',rows:[
  ['SQUAT','PPmvh7gBTi0',['أفخاذ أمامية','قلوتس'],['quads'],['glutes'],4,'6-12','LEG PRESS','nDh_BlnLCGc'],
  ['BARBELL RDL','5rIqP63yWFg',['أفخاذ خلفية','قلوتس'],['hams'],['glutes'],3,'6-12','DB RDL','u14AwrUcwWw'],
  ['LYING LEG CURL','ANKSmhT0dTk',['أفخاذ خلفية'],['hams'],[],3,'6-12','STANDING CABLE LEG CURL','bkwW1flKchc'],
  ['STANDING CALF RAISES','95itLfMBG40',['بطات'],['calves'],[],3,'6-12','LEG PRESS CALF RAISES','1cvpm--Y-4I'],
  ['CABLE CRUNCHES','dkGwcfo9zto',['بطن'],['abs'],[],3,'6-12','CRUNCHES','eeJ_CYqSoT4'],
  ['HANGING LEG RAISES','2n4UqRIJyk4',['بطن'],['abs'],[],3,'6-12','SUPPORTED LEG RAISES','PpZxg66ftYc']]},
 {n:3,cls:'c',title:'شامل',rows:[
  ['LEG PRESS','nDh_BlnLCGc',['أفخاذ أمامية','قلوتس'],['quads'],['glutes'],4,'6-12','SQUAT','PPmvh7gBTi0'],
  ['HIP THRUST','PqOnYf6Slkg',['قلوتس','أفخاذ خلفية'],['glutes'],['hams'],3,'6-12','MACHINE HIP THRUST','6jVU_KaQOfw'],
  ['SEATED ROW','w:YKAeU55CkVk',['لاتس','رومبويد','باي','كتف خلفي'],['lats','rhomb'],['biceps','rdelt'],3,'6-12','PULL UP','WLzut1ZxxTY'],
  ['LATS PULLDOWN','w:hnSqbBk15tw',['لاتس','باي'],['lats'],['biceps'],3,'6-12','ONE ARM ROW','KaCcBqhiXtc'],
  ['FLAT DB PRESS','1V3vpcaxRYQ',['صدر','أكتاف أمامية','تراي'],['chest'],['fdelt','triceps'],3,'6-12','MACHINE CHEST PRESS','relql3kwCi8'],
  ['TRICEPS PUSHDOWN','Rc7-euA8FDI',['تراي'],['triceps'],[],3,'6-12','OVERHEAD TRICEPS EXTENSION','7hx0-DZgdl8']]}
];
const url=id=>id.startsWith('w:')?'https://www.youtube.com/watch?v='+id.slice(2):'https://www.youtube.com/shorts/'+id;
const lnk=(name,id)=>'<a class="lnk" href="'+url(id)+'" target="_blank">'+PLAY+'<b>'+name+'</b></a>';
let html='';
DAYS.forEach(d=>{
  html+='<section class="page light grid dp" data-sec="اليوم '+d.n+' · '+d.title+'">'
   +'<i class="slash" style="left:-40px;bottom:-40px;width:90px;height:190px;opacity:.25"></i>'
   +'<div class="top"><div class="badge '+d.cls+'"><small>اليوم</small>'+d.n+'</div><h2>'+d.title+'</h2>'
   +'<div class="lg" style="margin-right:auto"><span><i></i>عضلة أساسية</span><span><i class="s"></i>عضلة مساعدة</span></div><div class="hint" style="margin-right:22px">'+PLAY.replace('class="pl"','class="pl" style="width:24px;height:24px"')+'اضغط على اسم التمرين لمشاهدة الشرح</div>'
   +'<img class="logo" src="../brand/logo-color.webp" alt="Nav Coaching"></div>'
   +'<div class="tbl"><div class="tr th"><div>#</div><div class="r">اسم التمرين</div><div>اسم العضلة</div><div>العضلات المستهدفة</div><div>الجولات</div><div>العدات</div><div class="alt-h">بديل التمرين</div></div>';
  d.rows.forEach((r,i)=>{const [name,id,mus,pri,sec,sets,reps,alt,altId]=r;
    html+='<div class="tr td"><div class="idx">'+(i+1)+'</div><div class="ex">'+lnk(name,id)+'</div>'
     +'<div class="tags">'+mus.map((m,k)=>'<span class="tag'+(k===0?' p':'')+'">'+m+'</span>').join('')+'</div>'
     +'<div class="fig">'+body('f',pri,sec)+body('b',pri,sec)+'</div>'
     +'<div class="num">'+sets+'</div><div><span class="rep">'+reps+'</span></div><div class="alt">'+lnk(alt,altId)+'</div></div>';});
  html+='</div></section>';
});
document.getElementById('dayPages').outerHTML=html;
// ---- pager on every page
document.querySelectorAll('.page').forEach((pg,i)=>{const n=i+1;
  let bar='';for(let k=1;k<=TOTAL;k++)bar+='<i class="'+(k<n?'done':k===n?'cur':'')+'"></i>';
  pg.insertAdjacentHTML('beforeend','<footer class="pager"><span class="sec"><b>'+(pg.dataset.sec||'')+'</b></span><div class="bar">'+bar+'</div><span class="num">'+String(n).padStart(2,'0')+' <span>/ '+String(TOTAL).padStart(2,'0')+'</span></span></footer>');});
</script>
</body></html>
