a{color:inherit;text-decoration:none}

/* ---------- light theme */
.light{background:#fff;color:var(--head)}

.cover .logo{position:absolute;top:64px;right:84px;height:64px;z-index:2}
.cover .chip{position:absolute;top:196px;right:84px;display:flex;gap:10px;align-items:center;font:700 19px "IBM Plex Sans Arabic";color:var(--navy);background:var(--cyan-soft);border:1.5px solid #4cc5ed88;border-radius:99px;padding:8px 20px}

.cover h1{position:absolute;top:262px;right:80px;font:800 118px/1.12 Cairo;letter-spacing:-.5px;color:var(--ink)}

.cover .sign b{color:var(--ink);font:800 21px Cairo}
.cover .sign span+span{padding-right:26px;border-right:1.5px solid var(--line);direction:ltr;font-family:"Readex Pro";color:var(--navy)}

.days{position:absolute;left:84px;top:150px;width:520px;display:flex;flex-direction:column;gap:22px;z-index:2}
.day{position:relative;display:flex;align-items:center;gap:24px;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:24px 28px;box-shadow:0 14px 34px #07142a14}

.day h3{font:800 34px/1.1 Cairo;color:var(--ink)}
